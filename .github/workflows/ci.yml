name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brodiffusion composes brotensor ops and uses brolm for its text frontend.
# The dependency closure is bromath (header-only) + brotensor (Tensor + CPU op
# backend) + broimage (image I/O; brolm needs it too) + brolm (text
# encoders/tokenizers) + brovisionml (image-to-3D encoders). CI builds the
# default CPU-only configuration (GPU backends OFF). The test and coverage
# jobs reconstruct the siblings beside this repo; the Submodule fallback job
# takes them from third_party/ instead:
#
#   $GITHUB_WORKSPACE/
#     brodiffusion/  <- this repo, checked out into a named path
#     bromath/
#     brotensor/
#     brolm/
#     broimage/
#     brovisionml/
#     bronze/       <- the JavaScript runtime brodiffusion_api binds
#     brass/         <- bronze's code generator
#
# bronze and brass are laid out by bronze's checkout-toolchain action and
# compiled inside this build tree (bronze add_subdirectory()s brass), with the
# job's own compiler and CRT — the api is bound across bronze's C++ embed
# boundary, so a prebuilt bronze would be an unverifiable ABI hazard. That is
# what makes brodiffusion_test_api the check that the library works the way
# bro uses it.
#
# Ninja on Linux/macOS bounds parallelism once brotensor's op TUs are in the
# build; Windows keeps the VS generator (MSBuild /m is bounded).
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brodiffusion
      - uses: actions/checkout@v7
        with: { repository: wlejon/bromath, path: bromath }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brotensor, path: brotensor }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brolm, path: brolm }
      - uses: actions/checkout@v7
        with: { repository: wlejon/broimage, path: broimage }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brovisionml, path: brovisionml }

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brodiffusion -B build -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S brodiffusion -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Submodule fallback ────────────────────────────────────────────────────
  #
  # No siblings beside the repo: bromath, brotensor, broimage, brolm and
  # brovisionml come from the flat third_party/ submodules at the commits this
  # repo pins, as they do for a fresh `git clone --recursive`. bronze and brass
  # are the documented exception (no submodule; the api has to compile against
  # the bronze of the program that loads it) and are laid out beside the repo
  # as in the other jobs. The configure step checks each sibling really took
  # the submodule path.
  submodule:
    name: Submodule fallback · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brodiffusion
          submodules: recursive

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        shell: bash
        run: |
          for s in bromath brotensor broimage brolm brovisionml; do test ! -e $s; done
          cmake -S brodiffusion -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          for s in bromath brotensor broimage brolm brovisionml; do
            grep -q "brodiffusion: $s from .*third_party/$s (submodule)" configure.log
          done

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brodiffusion
      - uses: actions/checkout@v7
        with: { repository: wlejon/bromath, path: bromath }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brotensor, path: brotensor }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brolm, path: brolm }
      - uses: actions/checkout@v7
        with: { repository: wlejon/broimage, path: broimage }
      - uses: actions/checkout@v7
        with: { repository: wlejon/brovisionml, path: brovisionml }

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install gcovr + Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr ninja-build

      - name: Configure (instrumented)
        run: |
          cmake -S brodiffusion -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brodiffusion/include/brodiffusion/' --filter 'brodiffusion/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `include/brodiffusion/` + `src/`'
            echo
            echo 'The bromath / brotensor / brolm / broimage siblings are filtered out.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
